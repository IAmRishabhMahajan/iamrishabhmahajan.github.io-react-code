<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var target =
          window.location.pathname + window.location.search + window.location.hash;

        window.location.replace(
          "/?redirect=" + encodeURIComponent(target)
        );
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
